<style>
  /* ---- Cards page additions on top of shared site.css ---- */
  .cards-back {
    font-family: var(--font-mono); font-size: 12px;
    color: var(--text-dim); letter-spacing: .04em; white-space: nowrap;
    padding: 7px 12px; border-radius: 8px;
    border: 1px solid var(--line); transition: color .15s, border-color .15s, background .15s;
  }
  .cards-back:hover { color: var(--text); border-color: var(--text-dim); background: var(--panel); }
  .topbar .brand { white-space: nowrap; flex: 0 0 auto; }

  .cards-hero { padding: 56px 0 28px; max-width: 64ch; }
  .cards-hero-title {
    font-family: var(--font-serif); font-weight: 400;
    font-size: clamp(40px, 5.2vw, 66px); line-height: 1.06;
    margin: 16px 0 20px; letter-spacing: -.01em; text-wrap: balance;
  }
  .cards-hero-title em { font-style: italic; color: var(--accent); }
  .cards-hero-lede { color: var(--text-dim); font-size: 17px; line-height: 1.6; }

  .cards-block { margin-top: 56px; }
  .cards-block:first-of-type { margin-top: 40px; }

  /* ---- Advertiser Disclosure modal ---- */
  .disclosure-btn {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em;
    color: var(--muted); background: transparent; border: none;
    cursor: pointer; padding: 0; margin: 12px 0 28px;
    text-decoration: underline; text-underline-offset: 3px;
    transition: color .15s;
  }
  .disclosure-btn:hover { color: var(--text-dim); }
  .disclosure-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.65);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; backdrop-filter: blur(4px);
  }
  .disclosure-modal {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 28px 32px; max-width: 480px;
    width: calc(100% - 40px); box-shadow: 0 24px 64px -16px rgba(0,0,0,.7);
  }
  .disclosure-modal-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px;
    font-family: var(--font-mono); font-size: 12px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--text-dim);
  }
  .disclosure-close {
    background: transparent; border: none; cursor: pointer;
    font-size: 20px; color: var(--muted); line-height: 1;
    padding: 0 4px; transition: color .15s;
  }
  .disclosure-close:hover { color: var(--text); }
  .disclosure-modal p {
    font-size: 14px; line-height: 1.65; color: var(--text-dim); margin: 0;
  }

  /* ---- CSR calculator tool callout ---- */
  .csr-tool {
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
    border: 1px solid color-mix(in oklab, #304CB2 45%, var(--line));
    border-radius: 16px; padding: 28px 32px;
    background: linear-gradient(135deg, color-mix(in oklab, #304CB2 22%, var(--panel)), var(--panel) 65%);
    position: relative; overflow: hidden;
  }
  .csr-tool::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0;
    width: 4px; background: #304CB2;
  }
  .csr-tool-left { display: flex; flex-direction: column; gap: 10px; max-width: 56ch; }
  .csr-tool-title {
    font-family: var(--font-serif); font-size: 26px; font-weight: 400;
    margin: 0; letter-spacing: -.01em; line-height: 1.1;
  }
  .csr-tool-desc { color: var(--text-dim); font-size: 15px; line-height: 1.6; margin: 0; }
  .csr-tool-btn {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-mono); font-size: 13px; font-weight: 600;
    letter-spacing: .04em; color: var(--bg); background: #304CB2;
    padding: 11px 20px; border-radius: 999px; width: fit-content;
    transition: transform .15s, filter .15s;
  }
  .csr-tool-btn:hover { transform: translateY(-2px); filter: brightness(1.15); }
  .csr-tool-badge {
    flex: 0 0 auto; width: 80px; height: 80px; border-radius: 50%;
    background: #304CB2; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: var(--font-mono); font-weight: 700; font-size: 18px;
    color: white; gap: 2px;
  }
  /* CSP variant (gold/Chase blue) */
  .csr-tool--csp {
    border-color: color-mix(in oklab, #0070BA 45%, var(--line));
    background: linear-gradient(135deg, color-mix(in oklab, #0070BA 18%, var(--panel)), var(--panel) 65%);
  }
  .csr-tool--csp::before { background: #0070BA; }
  .csr-tool-btn--csp { background: #0070BA; }
  .csr-tool-badge--csp { background: #0070BA; }

  @media (max-width: 640px) {
    .csr-tool { flex-direction: column; align-items: flex-start; padding: 22px 20px; }
    .csr-tool-badge { display: none; }
  }

  .cards-foot {
    border-top: 1px solid var(--line-soft);
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--font-mono); font-size: 12px; letter-spacing: .04em;
  }
  .cards-foot a { color: var(--text-dim); transition: color .15s; }
  .cards-foot a:hover { color: var(--accent); }

  @media (max-width: 640px) {
    .cards-hero { padding: 32px 0 18px; }
    .cards-block { margin-top: 44px; }
    .cards-foot { flex-direction: column; gap: 12px; align-items: flex-start; }
  }
</style>
